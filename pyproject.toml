[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-research"
version = "0.1.0"
description = "A project for stock market research and report generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "yfinance>=0.2.66",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "curl-cffi>=0.13.0",
    "notebook>=7.5.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "black>=26.10",
    "pre-commit>=4.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'  # notebooks are not formatted

[tool.setuptools]
py-modules = ["configuration"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "data_pipeline*", "web_gui*"]
